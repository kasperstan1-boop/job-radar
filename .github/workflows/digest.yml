name: Job Radar Digest

on:
  schedule:
    # Codziennie o 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: # Pozwala ręcznie odpalić bota przyciskiem w panelu GitHuba

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Żelazny bezpiecznik chroniący Twoje darmowe minuty

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # Pamięć podręczna przyspiesza instalację, oszczędzając kolejne minuty!

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie Job Radar
        run: python -m jobradar.pipeline
      env:
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
